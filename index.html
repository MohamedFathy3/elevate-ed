  <script>
  (function() {
    'use strict';

    function isElement(node) {
      return node && node.nodeType === 1 && node.tagName !== undefined;
    }

    function getClassName(el) {
      if (!isElement(el)) return '';
      if (typeof el.className === 'string') return el.className;
      if (el.className && typeof el.className === 'object' && el.className.baseVal !== undefined) {
        return el.className.baseVal;
      }
      return '';
    }

    const BAD_EXTENSIONS = [
      'idm', 'IDM', 'internet-download-manager',
      'video_downloader', 'video_saver', 'download_helper', 'save_video',
      'video_grabber', 'video_download', 'download_video', 'video_save',
      'video_downloader_plus', 'youtube_downloader', 'vid_downloader',
      'screen_recorder', 'recorder', 'capture', 'screen_capture'
    ];

    const originalAppendChild = Element.prototype.appendChild;
    Element.prototype.appendChild = function(child) {
      if (child && child.tagName === 'SCRIPT') {
        const src = child.src || '';
        if (src.includes('chrome-extension://')) {
          return document.createComment('Blocked');
        }
      }
      return originalAppendChild.call(this, child);
    };

    const originalInsertBefore = Element.prototype.insertBefore;
    Element.prototype.insertBefore = function(newNode, referenceNode) {
      if (newNode && newNode.nodeType === 1) {
        try {
          const id = newNode.id || '';
          const className = getClassName(newNode);
          const src = newNode.src || '';
          
          const idStr = typeof id === 'string' ? id : '';
          const classStr = typeof className === 'string' ? className : '';
          const srcStr = typeof src === 'string' ? src : '';
          
          for (const ext of BAD_EXTENSIONS) {
            if (idStr.toLowerCase().includes(ext) || 
                classStr.toLowerCase().includes(ext) ||
                srcStr.toLowerCase().includes(ext)) {
              return document.createComment('Blocked extension');
            }
          }
          
          if (idStr.includes('chrome-extension') || 
              classStr.includes('chrome-extension') ||
              srcStr.includes('chrome-extension://')) {
            return document.createComment('Blocked extension');
          }
        } catch (e) {
          // تجاهل أي خطأ
        }
      }
      return originalInsertBefore.call(this, newNode, referenceNode);
    };

    function removeExtensionElements() {
      try {
        const allElements = document.querySelectorAll('*');
        let removed = 0;
        
        allElements.forEach(el => {
          if (!isElement(el)) return;
          
          try {
            const id = el.id || '';
            const className = getClassName(el);
            const src = el.src || '';
            
            const idStr = typeof id === 'string' ? id : '';
            const classStr = typeof className === 'string' ? className : '';
            const srcStr = typeof src === 'string' ? src : '';
            
            for (const ext of BAD_EXTENSIONS) {
              if (idStr.toLowerCase().includes(ext) || 
                  classStr.toLowerCase().includes(ext) ||
                  srcStr.toLowerCase().includes(ext)) {
                el.remove();
                removed++;
                break;
              }
            }
            
            if (idStr.includes('chrome-extension') || 
                classStr.includes('chrome-extension') ||
                srcStr.includes('chrome-extension://')) {
              el.remove();
              removed++;
            }
          } catch (e) {
            // تجاهل أي خطأ في عنصر معين
          }
        });
        
        if (removed > 0) {
          console.log(`✅ تم إزالة ${removed} عنصر من الإضافات`);
        }
      } catch (e) {
        console.warn('⚠️ خطأ في تنظيف الإضافات:', e.message);
      }
    }

    setInterval(removeExtensionElements, 1000);

    const originalFetch = window.fetch;
    window.fetch = function(url, options) {
      if (url && typeof url === 'string' && url.includes('chrome-extension://')) {
        return Promise.reject(new Error('Extension blocked'));
      }
      return originalFetch.call(this, url, options);
    };

    const originalXHROpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...args) {
      if (url && typeof url === 'string' && url.includes('chrome-extension://')) {
        return;
      }
      return originalXHROpen.call(this, method, url, ...args);
    };

    if (navigator.mediaDevices) {
      const originalGetDisplayMedia = navigator.mediaDevices.getDisplayMedia;
      navigator.mediaDevices.getDisplayMedia = function(constraints) {
        console.warn('⛔ تم منع تسجيل الشاشة');
        return Promise.reject(new Error('Screen recording is blocked'));
      };
    }

    window.addEventListener('error', function(e) {
      if (e.message && e.message.includes('ytcfg')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      if (e.message && e.message.includes('postMessage')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      if (e.message && e.message.includes('className.toLowerCase')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, true);

    console.log('✅ الحماية من الإضافات مفعلة');
  })();
  </script>
