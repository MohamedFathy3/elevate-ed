<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

          content="

    <!-- ========================================== -->
    <!-- ✅ ستايل شاشة التحميل والتحسينات           -->
    <!-- ========================================== -->
    <style>
      /* ============================================
         شاشة التحميل - تظهر حتى يتم تحميل React
         ============================================ */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a1a2a 0%, #1a3a5d 50%, #0a1a2a 100%);
        z-index: 999999;
        transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
      }
      
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      
      .loader-container {
        text-align: center;
        padding: 20px;
      }

      .loader-spinner {
        width: 70px;
        height: 70px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38B2AC;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
      }
      
      .loader-text {
        margin-top: 20px;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 28px;
        font-weight: 700;
      }

      .loader-text .highlight {
        color: #38B2AC;
      }

      .loader-text .mr {
        color: #F6AD55;
      }

      .loader-sub {
        margin-top: 8px;
        color: #38B2AC;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 600;
      }

      .loader-slogan {
        margin-top: 12px;
        color: #81E6D9;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 500;
        opacity: 0.9;
      }

      .loader-dots {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .loader-dot {
        width: 12px;
        height: 12px;
        background: #38B2AC;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .loader-dot:nth-child(1) {
        animation-delay: -0.32s;
      }

      .loader-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      .loader-dot:nth-child(3) {
        animation-delay: 0;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      /* ============================================
         تحسينات عامة
         ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        background: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      ::selection {
        background: rgba(56, 178, 172, 0.2);
        color: inherit;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      /* منع ظهور أدوات التحميل والإضافات */
      [id*="download" i],
      [class*="download" i],
      [data-video-downloader],
      [data-video-saver],
      [id*="chrome-extension"],
      [class*="chrome-extension"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* تحسين ظهور الفيديوهات */
      .video-wrapper {
        position: relative;
        width: 100%;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      }

      .video-wrapper video,
      .video-wrapper iframe,
      .video-wrapper object {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        display: block !important;
      }

      @media (max-width: 768px) {
        .video-wrapper {
          border-radius: 0;
        }
      }

      /* منع عناصر يوتيوب الإضافية */
      .ytp-chrome-top,
      .ytp-chrome-bottom,
      .ytp-chrome-controls,
      .ytp-left-controls,
      .ytp-right-controls,
      .ytp-fullscreen-button,
      .ytp-play-button,
      .ytp-volume-panel,
      .ytp-time-display,
      .ytp-progress-bar,
      .ytp-progress-bar-container,
      .ytp-related-videos,
      .ytp-endscreen,
      .ytp-cards-button,
      .ytp-share-button,
      .ytp-watch-later-button,
      .ytp-settings-button,
      .ytp-subtitles-button,
      .ytp-ad-overlay,
      .ytp-ad-image-overlay,
      .ytp-title,
      .ytp-title-channel,
      .ytp-title-text,
      .ytp-embed-title,
      .ytp-embed-watermark,
      .ytp-ce-element,
      .ytp-ce-video,
      .ytp-ce-playlist,
      .ytp-panel,
      .ytp-panel-menu,
      .ytp-menuitem,
      .ytp-tooltip,
      .ytp-tooltip-text,
      .ytp-popup,
      .ytp-popup-content,
      .ytp-chrome-top-buttons,
      .ytp-chrome-top-button,
      .ytp-player-bottom,
      .ytp-player-top,
      .ytp-gradient-top,
      .ytp-gradient-bottom,
      .ytp-watermark,
      .ytp-pause-overlay,
      .ytp-cued-thumbnail-overlay {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }

      iframe {
        border: none;
        display: block;
        width: 100%;
        height: 100%;
      }

      video,
      iframe[src*="youtube"],
      iframe[src*="vimeo"] {
        position: relative !important;
        z-index: 1 !important;
        pointer-events: auto !important;
      }

      /* منع أي عنصر عائم */
      [style*="position: fixed"]:not(.video-controls):not(.custom-controls),
      [style*="position: absolute"]:not(.video-controls):not(.custom-controls),
      [style*="z-index"][style*="999"]:not(.video-controls):not(.custom-controls),
      [style*="z-index"][style*="9999"]:not(.video-controls):not(.custom-controls),
      [style*="z-index"][style*="99999"]:not(.video-controls):not(.custom-controls) {
        z-index: auto !important;
      }
    </style>

    <!-- ========================================== -->
    <!-- ✅ حماية الموقع                           -->
    <!-- ========================================== -->
    <script>
    (function() {
      'use strict';

      function isElement(node) {
        return node && node.nodeType === 1 && node.tagName !== undefined;
      }

      function getClassName(el) {
        if (!isElement(el)) return '';
        if (typeof el.className === 'string') return el.className;
        if (el.className && typeof el.className === 'object' && el.className.baseVal !== undefined) {
          return el.className.baseVal;
        }
        return '';
      }

      const BAD_EXTENSIONS = [
        'idm', 'IDM', 'internet-download-manager',
        'video_downloader', 'video_saver', 'download_helper', 'save_video',
        'video_grabber', 'video_download', 'download_video', 'video_save',
        'video_downloader_plus', 'youtube_downloader', 'vid_downloader',
        'screen_recorder', 'recorder', 'capture', 'screen_capture'
      ];

      const originalAppendChild = Element.prototype.appendChild;
      Element.prototype.appendChild = function(child) {
        if (child && child.tagName === 'SCRIPT') {
          const src = child.src || '';
          if (src.includes('chrome-extension://')) {
            return document.createComment('Blocked');
          }
        }
        return originalAppendChild.call(this, child);
      };

      const originalInsertBefore = Element.prototype.insertBefore;
      Element.prototype.insertBefore = function(newNode, referenceNode) {
        if (newNode && newNode.nodeType === 1) {
          try {
            const id = newNode.id || '';
            const className = getClassName(newNode);
            const src = newNode.src || '';
            
            const idStr = typeof id === 'string' ? id : '';
            const classStr = typeof className === 'string' ? className : '';
            const srcStr = typeof src === 'string' ? src : '';
            
            for (const ext of BAD_EXTENSIONS) {
              if (idStr.toLowerCase().includes(ext) || 
                  classStr.toLowerCase().includes(ext) ||
                  srcStr.toLowerCase().includes(ext)) {
                return document.createComment('Blocked extension');
              }
            }
            
            if (idStr.includes('chrome-extension') || 
                classStr.includes('chrome-extension') ||
                srcStr.includes('chrome-extension://')) {
              return document.createComment('Blocked extension');
            }
          } catch (e) {}
        }
        return originalInsertBefore.call(this, newNode, referenceNode);
      };

      function removeExtensionElements() {
        try {
          const allElements = document.querySelectorAll('*');
          let removed = 0;
          
          allElements.forEach(el => {
            if (!isElement(el)) return;
            
            try {
              const id = el.id || '';
              const className = getClassName(el);
              const src = el.src || '';
              
              const idStr = typeof id === 'string' ? id : '';
              const classStr = typeof className === 'string' ? className : '';
              const srcStr = typeof src === 'string' ? src : '';
              
              for (const ext of BAD_EXTENSIONS) {
                if (idStr.toLowerCase().includes(ext) || 
                    classStr.toLowerCase().includes(ext) ||
                    srcStr.toLowerCase().includes(ext)) {
                  el.remove();
                  removed++;
                  break;
                }
              }
              
              if (idStr.includes('chrome-extension') || 
                  classStr.includes('chrome-extension') ||
                  srcStr.includes('chrome-extension://')) {
                el.remove();
                removed++;
              }
            } catch (e) {}
          });
          
          if (removed > 0) {
            console.log(`✅ تم إزالة ${removed} عنصر من الإضافات`);
          }
        } catch (e) {
          console.warn('⚠️ خطأ في تنظيف الإضافات:', e.message);
        }
      }

      setInterval(removeExtensionElements, 1000);

      const originalFetch = window.fetch;
      window.fetch = function(url, options) {
        if (url && typeof url === 'string' && url.includes('chrome-extension://')) {
          return Promise.reject(new Error('Extension blocked'));
        }
        return originalFetch.call(this, url, options);
      };

      const originalXHROpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        if (url && typeof url === 'string' && url.includes('chrome-extension://')) {
          return;
        }
        return originalXHROpen.call(this, method, url, ...args);
      };

      if (navigator.mediaDevices) {
        const originalGetDisplayMedia = navigator.mediaDevices.getDisplayMedia;
        navigator.mediaDevices.getDisplayMedia = function(constraints) {
          console.warn('⛔ تم منع تسجيل الشاشة');
          return Promise.reject(new Error('Screen recording is blocked'));
        };
      }

      console.log('Extension protection enabled');
    })();
  </script>
  </head>

  <body>
    <!-- ========================================== -->
    <!-- ✅ شاشة التحميل                           -->
    <!-- ========================================== -->
    <div id="app-loader" aria-hidden="true">
      <div class="loader-spinner"></div>
    </div>

    <!-- ========================================== -->
    <!-- ✅ نقطة ربط تطبيق React                    -->
    <!-- ========================================== -->
    <div id="root"></div>

    <!-- ========================================== -->
    <!-- ✅ تحميل التطبيق                           -->
    <!-- ========================================== -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ========================================== -->
    <!-- ✅ إخفاء شاشة التحميل بعد تحميل React     -->
    <!-- ========================================== -->
    <script>
      (function() {
        'use strict';

        function hideLoader() {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('hidden');
          }
        }

        if (document.readyState === 'complete') {
          setTimeout(hideLoader, 300);
        } else {
          window.addEventListener('load', function() {
            setTimeout(hideLoader, 500);
          });
        }

        setTimeout(hideLoader, 5000);

        const observer = new MutationObserver(function(mutations) {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            hideLoader();
            observer.disconnect();
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });

        console.log('Application ready');
      })();
    </script>


  </body>
