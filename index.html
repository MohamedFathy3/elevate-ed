      /* ============================================
         شاشة التحميل - تظهر حتى يتم تحميل React

      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        z-index: 999999;
        transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
      }
      
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      
      .loader-container {
        text-align: center;
        padding: 20px;
      }

      .loader-spinner {
        width: 70px;
        height: 70px;
        border: 5px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
      }
      
      .loader-text {
        margin-top: 20px;
        color: #1e293b;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 600;
      }

      .loader-sub {
        margin-top: 8px;
        color: #64748b;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
      }

      .loader-dots {
        margin-top: 12px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .loader-dot {
        width: 10px;
        height: 10px;
        background: #3b82f6;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .loader-dot:nth-child(1) {
        animation-delay: -0.32s;
      }

      .loader-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      .loader-dot:nth-child(3) {
        animation-delay: 0;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
